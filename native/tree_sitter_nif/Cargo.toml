[package]
name = "tree_sitter_nif"
version = "0.1.0"
authors = ["Delfos"]
edition = "2021"

[lib]
name = "tree_sitter_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"

# Core tree-sitter
tree-sitter = "0.25"

# Tier 1: grammars maduros
tree-sitter-elixir     = "0.3"
tree-sitter-typescript = "*"
tree-sitter-javascript = "*"
tree-sitter-python     = "*"
tree-sitter-rust       = "*"
tree-sitter-go         = "*"
tree-sitter-java       = "*"
tree-sitter-c-sharp    = "*"
tree-sitter-c          = "*"
tree-sitter-cpp        = "*"
tree-sitter-php        = "*"
tree-sitter-ruby       = "*"
tree-sitter-swift      = "*"
tree-sitter-dart       = "*"
tree-sitter-objc       = "*"
tree-sitter-kotlin-ng  = "*"

# Tier 2: grammars estables
tree-sitter-scala      = "*"
tree-sitter-lua        = "*"
tree-sitter-bash       = "*"
tree-sitter-json       = "*"
tree-sitter-yaml       = "*"
tree-sitter-r          = "*"
tree-sitter-asm        = "*"
tree-sitter-fsharp     = "*"
# Pinned to 0.25.10 — the latest 0.25-compatible release. Versions 0.26.x
# require tree-sitter ^0.26, which would force an ABI upgrade of the whole
# NIF (and conflict with the rest of the crate pinned to 0.25).
tree-sitter-powershell = "=0.25.10"

# Tier 3: extended coverage — grammars that might have weaker
# upstream support but we still wire up so the dispatcher can use
# them when present. Pin to a specific minor where known.
tree-sitter-haskell    = "*"
tree-sitter-erlang     = "*"
tree-sitter-ocaml      = "*"
tree-sitter-clojure    = "*"
tree-sitter-zig        = "*"
tree-sitter-gleam      = "*"
tree-sitter-julia      = "*"
tree-sitter-hcl        = "*"
# tree-sitter-perl is intentionally omitted: the latest published
# version (1.1.2) requires tree-sitter ^0.26, which would force the
# whole NIF to upgrade to a 0.26-based ABI. The rest of the grammars
# in this crate are pinned to tree-sitter 0.25, so the perl grammar
# would either drop the rest of the project to 0.25 or trigger a
# Cargo resolver conflict. We accept losing the perl highlight for
# now; the dispatcher still routes `.pl` to the regex GenericParser.
#
# tree-sitter-powershell and tree-sitter-groovy are intentionally
# omitted for the same ABI reason: their latest published versions
# (0.26.4 and 0.1.2 respectively) require tree-sitter ^0.26. Both
# languages still have syntax modules for highlighting in the Elixir
# registry, but parsing falls back to the regex GenericParser until
# a tree-sitter 0.25-targeted release is available upstream.

[profile.release]
opt-level = 3
lto = true
