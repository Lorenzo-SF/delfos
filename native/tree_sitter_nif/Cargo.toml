[package]
name = "tree_sitter_nif"
version = "0.1.0"
authors = ["Delfos"]
edition = "2021"

[lib]
name = "tree_sitter_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"

# Core tree-sitter
tree-sitter = "0.25"

# Tier 1: grammars maduros
tree-sitter-elixir    = "0.3"
tree-sitter-typescript = "*"
tree-sitter-javascript = "*"
tree-sitter-python    = "*"
tree-sitter-rust      = "*"
tree-sitter-go        = "*"
tree-sitter-java      = "*"
tree-sitter-c-sharp   = "*"
tree-sitter-c         = "*"
tree-sitter-cpp       = "*"
tree-sitter-php       = "*"
tree-sitter-ruby      = "*"
tree-sitter-swift     = "*"
tree-sitter-dart      = "*"

# Tier 2: grammars estables
tree-sitter-scala     = "*"
tree-sitter-lua       = "*"
tree-sitter-bash      = "*"
tree-sitter-json      = "*"
tree-sitter-yaml      = "*"

[profile.release]
opt-level = 3
lto = true
