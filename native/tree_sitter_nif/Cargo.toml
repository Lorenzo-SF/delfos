[package]
name = "tree_sitter_nif"
version = "0.1.0"
authors = ["Delfos"]
edition = "2021"

[lib]
name = "tree_sitter_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"

# Core tree-sitter
tree-sitter = "0.22"

# Tier 1: grammars maduros
tree-sitter-elixir    = "0.3"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-python    = "0.21"
tree-sitter-rust      = "0.21"
tree-sitter-go        = "0.21"
tree-sitter-java      = "0.21"
tree-sitter-kotlin    = "0.3"
tree-sitter-c-sharp   = "0.21"
tree-sitter-c         = "0.21"
tree-sitter-cpp       = "0.22"
tree-sitter-php       = "0.22"
tree-sitter-ruby      = "0.21"
tree-sitter-swift     = "0.5"
tree-sitter-dart      = "0.1"

# Tier 2: grammars estables
tree-sitter-scala     = "0.21"
tree-sitter-lua       = "0.1"
tree-sitter-bash      = "0.21"
tree-sitter-toml      = "0.6"
tree-sitter-json      = "0.21"
tree-sitter-yaml      = "0.6"

[profile.release]
opt-level = 3
lto = true
